name: anythingllm

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm:
    container_name: anythingllm
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "storage:/app/server/storage"
      - "hotdir:/app/collector/hotdir"
      - "outputs:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/anythingllm
    env_file:
      - .env
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

  postgres:
        image: postgres:18-alpine
        ports:
            - "5432:5432"
        volumes:
            - database:/var/lib/postgresql
        environment:
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=anythingllm
            - POSTGRES_USER=postgres
        networks:
            - anything-llm

volumes:
  storage:
  hotdir:
  outputs:
  database:
